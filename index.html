<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Northern Light Tour (22 Days) - Interactive Itinerary</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Password Protection Overlay -->
  <div id="auth-overlay">
    <div id="auth-modal">
      <div class="lock-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2>Protected Access</h2>
      <p>Please enter the 4-digit passcode to view the 2026 Northern Light Tour itinerary.</p>
      
      <div class="pin-input-container">
        <input type="password" maxlength="1" class="pin-digit" autofocus>
        <input type="password" maxlength="1" class="pin-digit">
        <input type="password" maxlength="1" class="pin-digit">
        <input type="password" maxlength="1" class="pin-digit">
      </div>
      
      <button id="auth-submit-btn">Unlock Itinerary</button>
      <div id="auth-error-msg">Incorrect passcode. Please try again.</div>
    </div>
  </div>

  <div class="layout">
    <!-- Sidebar Navigation -->
    <div id="sidebar">
      <div class="sidebar-header">
        <h1><i class="fa-solid fa-snowflake" style="color: #2563eb;"></i> Northern Light Tour</h1>
        <p style="margin: 3px 0 0 0; font-size: 12px; color: #64748b;">Dec 12, 2026 – Jan 02, 2027 (22 Days)</p>
        
        <div class="header-action-buttons">
          <a href="tour_package.html" target="_blank" class="action-btn blue"><i class="fa-solid fa-file-pdf"></i> Tour Package</a>
        </div>
      </div>

      <div id="itinerary-list">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>

    <!-- Leaflet Map Container -->
    <div id="map"></div>
  </div>

  <!-- CryptoJS Library for AES Decryption -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <!-- Application Data & Logic -->
  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
