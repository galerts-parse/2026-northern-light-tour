<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Northern Light Tour (22 Days) - Interactive Itinerary</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Password Protection Overlay -->
  <div id="auth-overlay">
    <div id="auth-modal">
      <div class="lock-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2>Protected Access</h2>
      <p>Please enter the 4-digit passcode to view the 2026 Northern Light Tour itinerary.</p>
      
      <form id="auth-form" action="javascript:void(0);">
        <div class="pin-field-container">
          <input type="password" 
                 id="pin-hidden-input" 
                 inputmode="numeric" 
                 pattern="[0-9]*" 
                 maxlength="4" 
                 autocomplete="off"
                 autofocus>
          <div class="pin-display-boxes" id="pin-display-boxes">
            <div class="pin-digit-box"></div>
            <div class="pin-digit-box"></div>
            <div class="pin-digit-box"></div>
            <div class="pin-digit-box"></div>
          </div>
        </div>
        
        <button type="submit" id="auth-submit-btn">Unlock Itinerary</button>
      </form>
      <div id="auth-error-msg">Incorrect passcode. Please try again.</div>
    </div>
  </div>

  <div class="layout">
    <!-- Sidebar Navigation -->
    <div id="sidebar">
      <div class="sidebar-header">
        <h1><i class="fa-solid fa-snowflake" style="color: #2563eb;"></i> Northern Light Tour</h1>
        <p style="margin: 3px 0 0 0; font-size: 12px; color: #64748b;">Dec 12, 2026 – Jan 02, 2027 (22 Days)</p>

        <!-- Route Selector Dropdown -->
        <select id="route-selector" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 13px; background: white; outline: none; margin-top: 12px; font-weight: 600; color: #1e293b;">
          <option value="routeB" selected>Route B: High-Action Nature & Foodie Explorer (22 Days)</option>
          <option value="routeA">Route A: Baseline Itinerary (Classic 22 Days)</option>
        </select>
        
        <div class="header-action-buttons">
          <a href="tour_package.html" class="action-btn blue"><i class="fa-solid fa-file-pdf"></i> Tour Package</a>
          <a href="food.html" class="action-btn green" style="margin-left: 4px;"><i class="fa-solid fa-utensils"></i> FOOD! Guide</a>
        </div>
      </div>

      <div id="itinerary-list">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>

    <!-- Leaflet Map Container -->
    <div id="map"></div>
  </div>

  <!-- CryptoJS Library for AES Decryption -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <!-- Application Data & Logic -->
  <script src="data.js?v=20260912_v8"></script>
  <script src="app.js?v=20260912_v8"></script>

</body>
</html>
